<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期末复习大本营</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d9488'/%3E%3Cpath d='M16 47V21c0-2.8 2.2-5 5-5h27v30H21c-2.8 0-5 2.2-5 5z' fill='none' stroke='white' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M21 43h27' stroke='white' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f0; --surface:#ffffff; --ink:#22211d; --ink-2:#6d6a61; --line:#e7e5dd;
  --accent:#0d9488; --accent-ink:#ffffff; --accent-soft:#dcf0ec;
  --ok:#2f9e63; --ok-soft:#e1f1e7;
  --warn:#c07f17; --warn-soft:#f7ecd7;
  --danger:#cf4a3f; --danger-soft:#f8e4e1;
  --track:#e9e7df; --shadow:0 1px 2px rgba(34,33,29,.05),0 10px 28px -18px rgba(34,33,29,.18);
  --radius:14px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13161b; --surface:#1c2027; --ink:#e9e7e1; --ink-2:#a0a7b1; --line:#2a3039;
  --accent:#2dd4bf; --accent-ink:#06201c; --accent-soft:rgba(45,212,191,.14);
  --ok:#46c37c; --ok-soft:rgba(70,195,124,.15);
  --warn:#e0a94e; --warn-soft:rgba(224,169,78,.15);
  --danger:#ef7a6f; --danger-soft:rgba(239,122,111,.15);
  --track:#2c333d; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 480px at 85% -10%,rgba(13,148,136,.09),transparent 60%)}
html[data-theme="dark"] body::before{background:radial-gradient(900px 480px at 85% -10%,rgba(45,212,191,.07),transparent 60%)}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 96px}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
ul{padding:0;margin:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{flex:none;vertical-align:-3px}
#countdown,#todo,#quiz,[id^="sub-"]{scroll-margin-top:18px}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:44px;height:44px;flex:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.brand .logo svg{width:24px;height:24px}
.brand h1{font-size:clamp(19px,2.6vw,24px);letter-spacing:.5px}
.brand p{font-size:12.5px;color:var(--ink-2);margin:2px 0 0}
.top-right{display:flex;align-items:center;gap:10px}
.overall{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
.overall .ring-box{position:relative;width:40px;height:40px}
.overall .ring-box span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.overall .lbl{font-size:12px;color:var(--ink-2);line-height:1.3}
.icon-btn{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);transition:border-color .2s,color .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 布局与侧栏 */
.layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px;align-items:start}
.sidebar{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.sidebar.open{transform:none}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.side-head h3{font-size:13px;letter-spacing:2px;color:var(--ink-2)}
.side-close{width:34px;height:34px;display:none}
#toc .sec{color:var(--ink-2);font-size:12px;letter-spacing:1px;padding:14px 11px 4px;font-weight:600}
#toc a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:14px;transition:background .15s,color .15s}
#toc a:hover{background:var(--accent-soft);color:var(--ink)}
#toc a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* 番茄钟 */
.pomo{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.pomo h4{font-size:13px;letter-spacing:1.5px;color:var(--ink-2);margin-bottom:12px;text-align:center}
.pomo-ring{position:relative;width:150px;height:150px;margin:0 auto 12px}
.pomo-ring .time{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.pomo-modes{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.pomo-modes button{flex:1;border:none;background:transparent;color:var(--ink-2);padding:7px 0;border-radius:8px;font-size:13px;font-weight:600}
.pomo-modes button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.pomo .row{display:flex;gap:8px}
.pomo .row .btn{flex:1}
.pomo .sess{text-align:center;font-size:12.5px;color:var(--ink-2);margin-top:10px}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:background .25s,border-color .25s}
.card + .card{margin-top:16px}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 svg.ic{color:var(--accent)}
.hint{font-size:13px;color:var(--ink-2)}
.main > section{margin-bottom:16px}

/* 倒计时 */
.count-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:flex;flex-direction:column;gap:2px;min-width:150px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;transition:border-color .2s,transform .15s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip .c-top{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.chip .c-num{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.chip .c-sub{font-size:12px;color:var(--ink-2)}
.chip.ok .c-num{color:var(--ok)} .chip.warn .c-num{color:var(--warn)} .chip.danger .c-num{color:var(--danger)} .chip.past .c-num{color:var(--ink-2)}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .s-ic{color:var(--accent);margin-bottom:6px}
.stat .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .lbl{font-size:12.5px;color:var(--ink-2)}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:2px}

/* 科目卡片 */
.subject{--sub:var(--accent)}
.subject-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subject-head h3{font-size:18px;display:flex;align-items:center;gap:9px}
.sub-dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
.subject-head .spacer{flex:1}
.mastery{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--ink-2)}
.mastery.m1{color:var(--accent);border-color:var(--accent)}
.mastery.m2{color:var(--ok);border-color:var(--ok)}
.prog{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.bar{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar > div{height:100%;width:0;background:var(--sub);border-radius:99px;transition:width .35s ease}
.prog .pct{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 4px;font-size:13.5px;color:var(--ink-2)}
.date-row input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;color:var(--ink);font-size:16px}
.days{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.days.ok{color:var(--ok);background:var(--ok-soft)}
.days.warn{color:var(--warn);background:var(--warn-soft)}
.days.danger{color:var(--danger);background:var(--danger-soft)}
.days.past{color:var(--ink-2);background:var(--bg)}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin:16px 0 8px}
.sec-title svg.ic{color:var(--accent)}
.kp-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;transition:background .15s}
.kp-item:hover{background:var(--bg)}
.kp-item label{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14.5px}
.kp-item .txt{word-break:break-word}
.kp-item input[type=checkbox],.todo-item input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent);cursor:pointer}
.kp-item.done .txt,.todo-item.done .txt{color:var(--ink-2);text-decoration:line-through}
.mini-btn{width:30px;height:30px;flex:none;display:grid;place-items:center;border:none;background:transparent;color:var(--ink-2);border-radius:8px;transition:background .15s,color .15s}
.mini-btn:hover{background:var(--danger-soft);color:var(--danger)}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:16px}
.add-row input:focus{border-color:var(--accent);outline:none}
textarea.note{width:100%;min-height:88px;resize:vertical;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:16px;line-height:1.7}
textarea.note:focus{border-color:var(--accent);outline:none}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* 待办 */
.todo-item{display:flex;align-items:center;gap:6px;padding:8px;border-radius:9px;transition:background .15s}
.todo-item:hover{background:var(--bg)}
.todo-item label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px}

/* 随机抽考点 */
.quiz-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:112px;margin:14px 0;padding:22px;border:1px dashed var(--line);background:var(--accent-soft);border-radius:12px;text-align:center}
.quiz-box .q-sub{font-size:12px;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.quiz-box .q-text{font-size:17px;font-weight:600}
.quiz-box .q-empty{font-size:14px;color:var(--ink-2)}
.quiz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quiz-note{text-align:center;font-size:12.5px;color:var(--ink-2)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}

/* 悬浮按钮与遮罩 */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(13,148,136,.55)}
.scrim{position:fixed;inset:0;z-index:49;background:rgba(20,18,14,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);z-index:70;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}

@keyframes drawerIn{from{transform:translateX(-105%)}to{transform:none}}
@media (min-width:640px){
  .stats{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:1023px){
  .sidebar{display:none;position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;height:100%;overflow-y:auto;border:1px solid var(--line);border-radius:0;transform:translateX(-105%)}
  .sidebar.open{display:block;transform:none;animation:drawerIn .28s ease}
  .side-close{display:grid}
}
@media (min-width:1024px){
  .fab,.scrim,.side-close{display:none}
  .layout{grid-template-columns:250px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4M3 9h18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 5-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 13a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
</svg>

<header class="wrap topbar">
  <div class="brand">
    <span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-book" xlink:href="#i-book"/></svg></span>
    <div>
      <h1>期末复习大本营</h1>
      <p>把每一门都安排明白</p>
    </div>
  </div>
  <div class="top-right">
    <div class="overall">
      <div class="ring-box" id="overall-ring"></div>
      <div class="lbl">总复习<br>进度</div>
    </div>
    <button class="icon-btn" id="theme-btn" data-action="theme" title="切换深色 / 浅色模式" aria-label="切换主题">
      <span id="theme-icon"></span>
    </button>
  </div>
</header>

<div class="layout wrap">
  <aside class="sidebar" id="sidebar" aria-label="复习目录">
    <div class="side-head">
      <h3>复习目录</h3>
      <button class="icon-btn side-close" data-action="close-drawer" title="收起目录" aria-label="收起目录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-x" xlink:href="#i-x"/></svg></button>
    </div>
    <nav id="toc"></nav>
    <div class="pomo">
      <h4>番茄专注</h4>
      <div class="pomo-ring" id="pomo-ring"></div>
      <div class="pomo-modes" role="tablist" aria-label="番茄钟模式">
        <button data-mode="focus" data-action="timer-mode">专注 25</button>
        <button data-mode="short" data-action="timer-mode">短休 5</button>
        <button data-mode="long" data-action="timer-mode">长休 15</button>
      </div>
      <div class="row">
        <button class="btn" id="pomo-btn" data-action="timer-start">开始</button>
        <button class="btn ghost" data-action="timer-reset">重置</button>
      </div>
      <p class="sess" id="pomo-sess">今日已完成 0 个番茄 · 专注 0 分钟</p>
    </div>
  </aside>

  <main class="main">
    <section class="card" id="countdown">
      <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-cal" xlink:href="#i-cal"/></svg>考试倒计时</h2>
      <div class="count-list" id="countdown-list"></div>
    </section>

    <section class="stats" aria-label="复习统计">
      <div class="stat">
        <div class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-book" xlink:href="#i-book"/></svg></div>
        <div class="num" id="stat-subjects">–</div>
        <div class="lbl">在复习科目</div>
        <div class="sub" id="stat-subjects-sub"></div>
      </div>
      <div class="stat">
        <div class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-circle-check" xlink:href="#i-circle-check"/></svg></div>
        <div class="num" id="stat-todo">–</div>
        <div class="lbl">待办完成</div>
        <div class="sub" id="stat-todo-sub"></div>
      </div>
      <div class="stat">
        <div class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-target" xlink:href="#i-target"/></svg></div>
        <div class="num" id="stat-points">–</div>
        <div class="lbl">考点掌握</div>
        <div class="sub" id="stat-points-sub"></div>
      </div>
      <div class="stat">
        <div class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-clock" xlink:href="#i-clock"/></svg></div>
        <div class="num" id="stat-focus">–</div>
        <div class="lbl">今日专注</div>
        <div class="sub" id="stat-focus-sub"></div>
      </div>
    </section>

    <section id="subjects">
      <h2 class="sec-title" style="font-size:16px;margin:6px 0 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-book" xlink:href="#i-book"/></svg>科目清单</h2>
      <div id="subject-list"></div>
      <div class="card">
        <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-plus" xlink:href="#i-plus"/></svg>添加科目</h2>
        <div class="add-row">
          <input id="new-subject" placeholder="科目名称，如：线性代数" aria-label="新科目名称">
          <button class="btn" data-action="add-subject">添加科目</button>
        </div>
      </div>
    </section>

    <section class="card" id="todo">
      <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-circle-check" xlink:href="#i-circle-check"/></svg>复习待办清单</h2>
      <div class="prog"><div class="bar"><div id="todo-bar" style="width:0%"></div></div><span class="pct" id="todo-pct"></span></div>
      <ul id="todo-list"></ul>
      <div class="add-row">
        <input id="new-todo" placeholder="新增一条待办，回车添加" aria-label="新待办">
        <button class="btn ghost" data-action="add-todo">添加</button>
      </div>
    </section>

    <section class="card" id="quiz">
      <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-dice" xlink:href="#i-dice"/></svg>随机抽考点自测</h2>
      <div class="quiz-box" id="quiz-box"></div>
      <div class="quiz-actions">
        <button class="btn" data-action="quiz">随机抽取一条</button>
      </div>
      <p class="quiz-note" id="quiz-count">已抽 0 次</p>
    </section>
  </main>
</div>

<button class="fab" data-action="open-drawer" aria-label="打开目录">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#i-list" xlink:href="#i-list"/></svg>
</button>
<div class="scrim" id="scrim" data-action="close-drawer"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ==================== 状态与工具 ==================== */
const LS_KEY='fexam.v1';
const PALETTE=['#0d9488','#6366f1','#d97706','#db2777','#0ea5e9','#7c3aed'];
const MODES={focus:{min:25,label:'专注'},short:{min:5,label:'短休'},long:{min:15,label:'长休'}};
const DAY=86400000;
let lastQuiz=null;
let timerTick=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>'<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-'+n+'" xlink:href="#i-'+n+'"/></svg>';

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return 's'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function daysLeft(dateStr){if(!dateStr)return null;const d=new Date(dateStr+'T23:59:59');return Math.ceil((d-new Date())/DAY);}
function fmtDate(dateStr){if(!dateStr)return '';const d=new Date(dateStr+'T00:00:00');return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function subProgress(s){return s.points.length? s.points.filter(p=>p.d).length/s.points.length : 0;}
function overallPct(){if(!state.subjects.length)return 0;return Math.round(state.subjects.reduce((a,s)=>a+subProgress(s),0)/state.subjects.length*100);}
function ringSVG(pct,size,stroke){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .4s ease;transform:rotate(-90deg);transform-origin:center"/></svg>';
}

/* ==================== 默认数据 ==================== */
function defaultState(){
  return {
    theme:'light',
    subjects:[
      {id:'s1',name:'高等数学',date:'',mastery:0,points:[
        {t:'极限计算：两个重要极限与等价无穷小',d:false},
        {t:'导数与微分：求导法则、隐函数求导',d:false},
        {t:'中值定理：罗尔、拉格朗日、洛必达法则',d:false},
        {t:'不定积分：换元法与分部积分',d:false},
        {t:'定积分：牛顿-莱布尼茨公式与应用',d:false},
        {t:'多元函数：偏导数、全微分与极值',d:false}
      ],note:''},
      {id:'s2',name:'程序设计',date:'',mastery:0,points:[
        {t:'数据类型、运算符与优先级',d:false},
        {t:'选择与循环结构',d:false},
        {t:'数组与字符串处理',d:false},
        {t:'函数：参数传递与递归',d:false},
        {t:'指针：指针与数组、函数指针',d:false},
        {t:'结构体与文件读写',d:false}
      ],note:''},
      {id:'s3',name:'大学英语',date:'',mastery:0,points:[
        {t:'高频词汇与同义替换',d:false},
        {t:'阅读：先看题干再回原文定位',d:false},
        {t:'翻译：常见句式与固定搭配',d:false},
        {t:'作文：三段式结构与万能句型',d:false},
        {t:'听力：关键词捕捉与选项预判',d:false}
      ],note:''}
    ],
    todos:[
      {t:'整理高数错题本',d:false},
      {t:'背英语作文模板',d:false},
      {t:'过一遍 C 语言指针章节',d:false}
    ],
    timer:{mode:'focus',left:25*60,running:false},
    sessionsToday:0,minutesToday:0,todayKey:todayKey(),quizCount:0
  };
}
let state;
try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(LS_KEY)||'null')||{});}catch(e){state=defaultState();}
if(!Array.isArray(state.subjects))state.subjects=defaultState().subjects;
if(!Array.isArray(state.todos))state.todos=[];
state.timer=Object.assign({mode:'focus',left:25*60,running:false},state.timer||{});
if(state.timer.left==null)state.timer.left=MODES[state.timer.mode].min*60;
if(state.todayKey!==todayKey()){state.todayKey=todayKey();state.sessionsToday=0;state.minutesToday=0;}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}

/* ==================== 渲染 ==================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('theme-icon').innerHTML=state.theme==='dark'?icon('sun'):icon('moon');
}
function renderHeader(){
  document.getElementById('overall-ring').innerHTML=ringSVG(overallPct(),40,4)+'<span>'+overallPct()+'%</span>';
}
function renderCountdown(){
  const box=document.getElementById('countdown-list');
  const items=state.subjects.filter(s=>s.date).sort((a,b)=>a.date<b.date?-1:1);
  if(!items.length){box.innerHTML='<p class="hint">还没有设置考试日期：在下方科目卡片里选择考试日期，倒计时会自动出现在这里。</p>';return;}
  box.innerHTML=items.map(s=>{
    const d=daysLeft(s.date);
    let label,cls;
    if(d<0){cls='past';label='考试已结束';}
    else if(d===0){cls='danger';label='今天考试';}
    else if(d<=7){cls='warn';label='还剩 '+d+' 天';}
    else{cls='ok';label='还剩 '+d+' 天';}
    return '<button class="chip '+cls+'" data-action="goto-sub" data-id="'+s.id+'">'
      +'<span class="c-top">'+icon('cal')+esc(s.name)+'</span>'
      +'<span class="c-num">'+label+'</span>'
      +'<span class="c-sub">'+fmtDate(s.date)+'</span></button>';
  }).join('');
}
function renderStats(){
  const tDone=state.todos.filter(t=>t.d).length;
  const allPts=state.subjects.reduce((a,s)=>a+s.points.length,0);
  const donePts=state.subjects.reduce((a,s)=>a+s.points.filter(p=>p.d).length,0);
  document.getElementById('stat-subjects').textContent=state.subjects.length+' 门';
  document.getElementById('stat-subjects-sub').textContent='平均进度 '+overallPct()+'%';
  document.getElementById('stat-todo').textContent=state.todos.length?tDone+' / '+state.todos.length:'0 / 0';
  document.getElementById('stat-todo-sub').textContent=state.todos.length?Math.round(tDone/state.todos.length*100)+'% 完成':'暂无待办';
  document.getElementById('stat-points').textContent=allPts?donePts+' / '+allPts:'0 / 0';
  document.getElementById('stat-points-sub').textContent=allPts?Math.round(donePts/allPts*100)+'% 已掌握':'暂无考点';
  document.getElementById('stat-focus').textContent=state.minutesToday+' 分钟';
  document.getElementById('stat-focus-sub').textContent=state.sessionsToday+' 个番茄';
}
function renderSubjects(){
  const box=document.getElementById('subject-list');
  if(!state.subjects.length){
    box.innerHTML='<div class="card"><p class="hint">还没有科目，用下方表单添加第一门课吧。</p></div>';
    return;
  }
  box.innerHTML=state.subjects.map((s,i)=>subjectCard(s,i,PALETTE[i%PALETTE.length])).join('');
}
function subjectCard(s,i,color){
  const prog=Math.round(subProgress(s)*100);
  const d=daysLeft(s.date);
  let dText='<span class="hint">未设置考试日期</span>';
  if(d!==null){
    dText=d<0?'<span class="days past">考试已结束</span>'
      :d===0?'<span class="days danger">今天考试</span>'
      :'<span class="days '+(d<=7?'warn':'ok')+'">还剩 '+d+' 天</span>';
  }
  const kps=s.points.map((p,pi)=>
    '<li class="kp-item'+(p.d?' done':'')+'" data-id="'+s.id+'" data-pi="'+pi+'">'
    +'<label><input type="checkbox" '+(p.d?'checked':'')+' data-action="toggle-point" aria-label="标记已掌握"><span class="txt">'+esc(p.t)+'</span></label>'
    +'<button class="mini-btn" data-action="del-point" title="删除考点" aria-label="删除考点">'+icon('x')+'</button></li>'
  ).join('');
  const kpList=s.points.length?kps:'<li class="hint" style="padding:6px 8px">还没有考点，添加一个开始复习吧。</li>';
  return '<article class="card subject" id="sub-'+s.id+'" style="--sub:'+color+'">'
    +'<div class="subject-head"><h3><span class="sub-dot"></span>'+esc(s.name)+'</h3>'
    +'<span class="spacer"></span>'
    +'<select class="mastery m'+s.mastery+'" data-action="set-mastery" data-id="'+s.id+'" aria-label="掌握程度">'
    +['未复习','进行中','已完成'].map((m,mi)=>'<option value="'+mi+'"'+(s.mastery===mi?' selected':'')+'>'+m+'</option>').join('')
    +'</select>'
    +'<button class="mini-btn" data-action="del-subject" data-id="'+s.id+'" data-name="'+esc(s.name)+'" title="删除科目" aria-label="删除科目">'+icon('trash')+'</button></div>'
    +'<div class="prog"><div class="bar"><div style="width:'+prog+'%"></div></div><span class="pct">'+prog+'%</span></div>'
    +'<div class="date-row">'+icon('cal')
    +'<input type="date" value="'+s.date+'" data-action="set-date" data-id="'+s.id+'" aria-label="考试日期">'+dText+'</div>'
    +'<h4 class="sec-title">'+icon('target')+' 核心考点</h4><ul class="kp-list">'+kpList+'</ul>'
    +'<div class="add-row"><input placeholder="添加考点，如：极限的夹逼准则" data-role="point-input" data-id="'+s.id+'" aria-label="新考点"><button class="btn ghost" data-action="add-point" data-id="'+s.id+'">'+icon('plus')+'添加</button></div>'
    +'<h4 class="sec-title">'+icon('note')+' 复习笔记</h4>'
    +'<textarea class="note" data-action="note" data-id="'+s.id+'" placeholder="随手记下易错点、公式、例题……会自动保存在本机浏览器">'+esc(s.note)+'</textarea>'
    +'</article>';
}
function renderTodo(){
  const ul=document.getElementById('todo-list');
  const done=state.todos.filter(t=>t.d).length;
  const pct=state.todos.length?Math.round(done/state.todos.length*100):0;
  document.getElementById('todo-bar').style.width=pct+'%';
  document.getElementById('todo-pct').textContent=state.todos.length?(done+' / '+state.todos.length+' · '+pct+'%'):'暂无待办';
  ul.innerHTML=state.todos.map((t,ti)=>
    '<li class="todo-item'+(t.d?' done':'')+'" data-ti="'+ti+'">'
    +'<label><input type="checkbox" '+(t.d?'checked':'')+' data-action="toggle-todo" aria-label="标记完成"><span class="txt">'+esc(t.t)+'</span></label>'
    +'<button class="mini-btn" data-action="del-todo" title="删除" aria-label="删除待办">'+icon('x')+'</button></li>'
  ).join('');
}
function renderQuiz(){
  const box=document.getElementById('quiz-box');
  if(!lastQuiz){box.innerHTML='<div class="q-empty">点击下方按钮，随机抽一条考点自测背诵。</div>';}
  else{box.innerHTML='<span class="q-sub">'+esc(lastQuiz.subject)+'</span><div class="q-text">'+esc(lastQuiz.text)+'</div>';}
  document.getElementById('quiz-count').textContent='已抽 '+(state.quizCount||0)+' 次';
}
function renderTOC(){
  const nav=document.getElementById('toc');
  const subs=state.subjects.map(s=>'<a href="#sub-'+s.id+'" data-spy="sub-'+s.id+'">'+esc(s.name)+'</a>').join('');
  nav.innerHTML=(state.subjects.length?'<div class="sec">科目</div>'+subs:'<div class="sec">科目</div><a href="#subjects">暂无科目</a>')
    +'<div class="sec">总览</div>'
    +'<a href="#countdown" data-spy="countdown">'+icon('cal')+'考试倒计时</a>'
    +'<a href="#todo" data-spy="todo">'+icon('circle-check')+'复习待办</a>'
    +'<a href="#quiz" data-spy="quiz">'+icon('dice')+'随机抽考点</a>';
}
function renderPomo(){
  const m=MODES[state.timer.mode];
  const total=m.min*60;
  const left=Math.max(0,state.timer.left);
  const pct=total?Math.round((total-left)/total*100):0;
  document.getElementById('pomo-ring').innerHTML=ringSVG(pct,150,9)+'<span class="time">'+fmtTime(left)+'</span>';
  document.querySelectorAll('.pomo-modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.timer.mode));
  const btn=document.getElementById('pomo-btn');
  btn.dataset.action=state.timer.running?'timer-pause':'timer-start';
  btn.innerHTML=state.timer.running?icon('pause')+'暂停':(left<total?'继续':'开始');
  document.getElementById('pomo-sess').textContent='今日已完成 '+state.sessionsToday+' 个番茄 · 专注 '+state.minutesToday+' 分钟';
}
function initSpy(){
  if(!('IntersectionObserver' in window))return;
  const obs=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        document.querySelectorAll('#toc a[data-spy]').forEach(function(a){a.classList.toggle('active',a.dataset.spy===en.target.id);});
      }
    });
  },{rootMargin:'-10% 0px -75% 0px',threshold:0});
  document.querySelectorAll('#countdown,#todo,#quiz,[id^="sub-"]').forEach(function(el){obs.observe(el);});
}
function renderAll(){
  applyTheme();renderHeader();renderCountdown();renderStats();renderSubjects();
  renderTodo();renderQuiz();renderTOC();renderPomo();initSpy();
}
</script>
<script>
/* ==================== 通用交互 ==================== */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function closeDrawer(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
function toggleTheme(){
  state.theme=state.theme==='dark'?'light':'dark';
  applyTheme();save();
}

/* ==================== 随机抽考点 ==================== */
function drawQuiz(){
  const pool=[];
  state.subjects.forEach(s=>s.points.forEach(p=>pool.push({subject:s.name,text:p.t})));
  if(!pool.length){lastQuiz=null;renderQuiz();toast('还没有考点，先去科目里添加吧');return;}
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1&&lastQuiz){
    let guard=0;
    while(pick.text===lastQuiz.text&&guard<8){pick=pool[Math.floor(Math.random()*pool.length)];guard++;}
  }
  lastQuiz=pick;
  state.quizCount=(state.quizCount||0)+1;save();renderQuiz();
  const box=document.getElementById('quiz-box');
  box.classList.remove('pop');void box.offsetWidth;box.classList.add('pop');
}

/* ==================== 番茄钟 ==================== */
let actx=null;
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [0,.25,.5].forEach(function(o){
      const g=actx.createGain();g.connect(actx.destination);
      g.gain.setValueAtTime(.18,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+.3);
      const os=actx.createOscillator();os.type='sine';os.frequency.value=880;os.connect(g);
      os.start(t+o);os.stop(t+o+.32);
    });
  }catch(e){}
}
function tickTimer(){
  if(!state.timer.running)return;
  state.timer.left--;
  if(state.timer.left<=0){
    state.timer.left=0;state.timer.running=false;
    if(timerTick){clearInterval(timerTick);timerTick=null;}
    const m=MODES[state.timer.mode];
    if(state.timer.mode==='focus'){state.sessionsToday++;state.minutesToday+=m.min;}
    state.timer.left=m.min*60;
    beep();toast('番茄完成，休息一下');
    save();renderStats();
  }
  renderPomo();
}
function startTimer(){
  if(!state.timer.running){
    state.timer.running=true;
    if(state.timer.left<=0)state.timer.left=MODES[state.timer.mode].min*60;
    timerTick=setInterval(tickTimer,1000);
    renderPomo();
  }
}
function pauseTimer(){
  state.timer.running=false;
  if(timerTick){clearInterval(timerTick);timerTick=null;}
  renderPomo();
}
function resetTimer(){
  state.timer.running=false;
  if(timerTick){clearInterval(timerTick);timerTick=null;}
  state.timer.left=MODES[state.timer.mode].min*60;
  renderPomo();
}
function setMode(mode){
  state.timer.mode=mode;state.timer.running=false;
  if(timerTick){clearInterval(timerTick);timerTick=null;}
  state.timer.left=MODES[mode].min*60;
  renderPomo();
}

/* ==================== 事件绑定 ==================== */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  if(a==='theme'){toggleTheme();}
  else if(a==='open-drawer'){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show');}
  else if(a==='close-drawer'){closeDrawer();}
  else if(a==='goto-sub'){
    const target=document.getElementById('sub-'+el.dataset.id);
    if(target){target.scrollIntoView({behavior:'smooth',block:'start'});}
    closeDrawer();
  }
  else if(a==='add-point'){
    const id=el.dataset.id;
    const inp=document.querySelector('[data-role="point-input"][data-id="'+id+'"]');
    const v=(inp.value||'').trim();
    if(!v){toast('先写一条考点内容');inp.focus();return;}
    state.subjects.find(s=>s.id===id).points.push({t:v,d:false});
    inp.value='';save();renderSubjects();renderStats();renderHeader();renderTOC();
  }
  else if(a==='del-point'){
    const item=el.closest('.kp-item');
    const s=state.subjects.find(x=>x.id===item.dataset.id);
    s.points.splice(+item.dataset.pi,1);
    save();renderSubjects();renderStats();renderHeader();renderTOC();
  }
  else if(a==='del-subject'){
    const name=el.dataset.name;
    if(!confirm('确定删除「'+name+'」？该科目的考点和笔记会一起删除。'))return;
    state.subjects=state.subjects.filter(s=>s.id!==el.dataset.id);
    save();renderAll();
  }
  else if(a==='add-todo'){
    const inp=document.getElementById('new-todo');
    const v=(inp.value||'').trim();
    if(!v){toast('先写一条待办');inp.focus();return;}
    state.todos.push({t:v,d:false});
    inp.value='';save();renderTodo();renderStats();
  }
  else if(a==='del-todo'){
    state.todos.splice(+el.closest('.todo-item').dataset.ti,1);
    save();renderTodo();renderStats();
  }
  else if(a==='quiz'){drawQuiz();}
  else if(a==='add-subject'){
    const inp=document.getElementById('new-subject');
    const v=(inp.value||'').trim();
    if(!v){toast('输入科目名称');inp.focus();return;}
    state.subjects.push({id:uid(),name:v,date:'',mastery:0,points:[],note:''});
    inp.value='';save();renderAll();
    const card=document.getElementById('sub-'+state.subjects[state.subjects.length-1].id);
    if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
  }
  else if(a==='timer-start'){startTimer();}
  else if(a==='timer-pause'){pauseTimer();}
  else if(a==='timer-reset'){resetTimer();}
  else if(a==='timer-mode'){setMode(el.dataset.mode);}
});
document.addEventListener('change',function(e){
  const el=e.target;
  if(el.matches('input[type="date"]')){
    const s=state.subjects.find(x=>x.id===el.dataset.id);
    s.date=el.value;save();renderSubjects();renderCountdown();
  }
  else if(el.matches('select.mastery')){
    const s=state.subjects.find(x=>x.id===el.dataset.id);
    s.mastery=+el.value;save();renderSubjects();
  }
  else if(el.matches('input[data-action="toggle-point"]')){
    const item=el.closest('.kp-item');
    const s=state.subjects.find(x=>x.id===item.dataset.id);
    s.points[+item.dataset.pi].d=el.checked;
    save();renderSubjects();renderStats();renderHeader();renderTOC();
  }
  else if(el.matches('input[data-action="toggle-todo"]')){
    const item=el.closest('.todo-item');
    state.todos[+item.dataset.ti].d=el.checked;
    save();renderTodo();renderStats();
  }
});
document.addEventListener('input',function(e){
  if(e.target.matches('textarea.note')){
    const s=state.subjects.find(x=>x.id===e.target.dataset.id);
    s.note=e.target.value;save();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.matches('[data-role="point-input"]')){
    const btn=document.querySelector('button[data-action="add-point"][data-id="'+e.target.dataset.id+'"]');
    if(btn)btn.click();
  }
  else if(e.target.id==='new-todo'){
    const btn=document.querySelector('button[data-action="add-todo"]');
    if(btn)btn.click();
  }
  else if(e.target.id==='new-subject'){
    const btn=document.querySelector('button[data-action="add-subject"]');
    if(btn)btn.click();
  }
});

renderAll();
</script>
</body>
</html>
